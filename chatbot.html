<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<title>Ablauf-Assistent – Wohnraumverwaltung</title>
<!-- Bot- und Software-Copyright © 2026 Karl Opelt. Bezieht sich ausschliesslich auf den KI-/Chatbot selbst (Programm, Aufbau, Gestaltung) - NICHT auf die fachlichen Inhalte/Ablaeufe, die bei der Wohnraumverwaltung liegen. -->

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
:root{
  --bg:#eaeff7;--bg2:#e3e9f4;--surface:#ffffff;--surface-2:#f1f5f9;
  --text:#0f172a;--muted:#64748b;--border:#e5eaf1;
  --brand:#2563eb;--brand-ink:#1e3a8a;
  --grad:linear-gradient(135deg,#3b82f6 0%,#4f46e5 100%);
  --grad-soft:linear-gradient(135deg,#eff6ff 0%,#eef2ff 100%);
  --ring:rgba(59,130,246,.32);
  --shadow-sm:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
  --shadow-md:0 6px 20px rgba(15,23,42,.09);
  --shadow-lg:0 16px 44px rgba(15,23,42,.16);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,sans-serif;
  color:var(--text);font-size:16px;height:100%;overflow:hidden;position:fixed;width:100%;
  background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
}
#shell{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:600px;margin:0 auto;position:relative;background:transparent}
/* Header */
header{position:relative;background:var(--grad);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 15px) 16px 15px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 6px 24px rgba(37,99,235,.28);z-index:20}
header .avatar{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
header .htxt{flex:1;min-width:0}
header h1{font-size:16.5px;font-weight:750;letter-spacing:-.015em}
header .status{font-size:11.5px;opacity:.92;display:flex;align-items:center;gap:6px;margin-top:3px}
header .status .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.3);display:inline-block}
.hdr-btn{background:rgba(255,255,255,.16);border:none;color:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s}
.hdr-btn:hover{background:rgba(255,255,255,.28)}
.hdr-btn:active{transform:scale(.9)}
/* Tabs */
.tabs{display:flex;gap:6px;padding:10px 12px;background:var(--surface);flex-shrink:0;border-bottom:1px solid var(--border);z-index:15}
.tab{flex:1;padding:10px 8px;background:transparent;border:none;color:var(--muted);font-size:13px;font-weight:650;cursor:pointer;border-radius:12px;transition:all .18s;letter-spacing:-.01em}
.tab.active{background:var(--grad-soft);color:var(--brand);box-shadow:inset 0 0 0 1px var(--border)}
.tab:active{transform:scale(.98)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view.hidden{display:none}
/* Chat */
#chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 14px 8px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:12px 15px;border-radius:20px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;animation:pop .3s cubic-bezier(.22,1,.36,1);box-shadow:var(--shadow-sm)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:7px}
.msg.user{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:7px;box-shadow:0 8px 20px rgba(37,99,235,.3)}
.msg-time{font-size:10.5px;color:var(--muted);margin:-6px 5px 0;font-weight:500}
/* typing */
.typing{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:7px;padding:14px 18px;border-radius:20px;display:flex;gap:5px;box-shadow:var(--shadow-sm)}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.3s infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
/* feedback */
.fb-row{align-self:flex-start;display:flex;align-items:center;gap:8px;margin:-4px 0 0 6px}
.fb-q{font-size:11.5px;color:var(--muted)}
.fb-btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:36px;height:30px;font-size:15px;cursor:pointer;color:inherit;transition:all .15s;box-shadow:var(--shadow-sm)}
.fb-btn:hover{transform:translateY(-1px);border-color:var(--brand)}
.fb-done{align-self:flex-start;font-size:11.5px;color:#16a34a;margin:-2px 0 0 6px;font-weight:600}
/* suggestions */
.sugg-row{align-self:flex-start;display:flex;flex-direction:column;gap:8px;margin:2px 0;max-width:86%}
.sugg-btn{text-align:left;background:var(--surface);color:var(--brand-ink);border:1px solid var(--border);border-radius:14px;padding:11px 15px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm)}
.sugg-btn:hover{transform:translateY(-1px);border-color:var(--brand);box-shadow:var(--shadow-md)}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 14px 12px;flex-shrink:0;max-height:170px;overflow-y:auto}
.chip{background:var(--surface);color:var(--brand-ink);border:1px solid var(--border);border-radius:999px;padding:9px 15px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;box-shadow:var(--shadow-sm)}
.chip:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:#cbd5e1}
.chip:active{transform:scale(.97)}
.chip.cat{background:var(--grad);color:#fff;border:none;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.chip.back{background:var(--surface-2);color:var(--muted)}
/* input */
.inputbar{background:var(--surface);border-top:1px solid var(--border);padding:12px;display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
.inputbar textarea{flex:1;border:1.5px solid var(--border);border-radius:22px;padding:12px 18px;font-size:15px;background:var(--surface-2);color:var(--text);outline:none;resize:none;max-height:120px;font-family:inherit;line-height:1.35;transition:border-color .15s,box-shadow .15s,background .15s}
.inputbar textarea:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px var(--ring)}
.sendbtn{width:46px;height:46px;border-radius:16px;background:var(--grad);color:#fff;border:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;box-shadow:0 6px 18px rgba(37,99,235,.35);transition:transform .15s,filter .15s}
.sendbtn:hover{filter:brightness(1.06)}
.sendbtn:active{transform:scale(.9)}
.sendbtn:disabled{background:#94a3b8;box-shadow:none;cursor:default}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
/* witz */
.witz-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:18px}
.witz-card{background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:30px 24px;width:100%;max-width:520px;box-shadow:var(--shadow-lg);margin-top:auto;position:relative;overflow:hidden}
.witz-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--grad)}
.witz-label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.witz-date{font-size:12.5px;color:var(--muted);text-align:center;margin-top:4px;margin-bottom:20px}
.witz-text{font-size:20px;line-height:1.5;font-weight:550;color:var(--text);text-align:center;white-space:pre-wrap;min-height:80px;display:flex;align-items:center;justify-content:center;letter-spacing:-.01em}
.witz-count{font-size:11px;color:var(--muted);text-align:center;margin-top:20px;font-weight:500}
.witz-actions{width:100%;max-width:520px;display:flex;flex-direction:column;gap:11px;margin-bottom:auto}
.witz-btn{width:100%;padding:15px;border:none;border-radius:16px;background:var(--grad);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(37,99,235,.3);transition:transform .15s,filter .15s}
.witz-btn:hover{filter:brightness(1.05)}
.witz-btn:active{transform:scale(.98)}
.witz-btn.secondary{background:var(--surface);color:var(--brand);border:1.5px solid var(--border);box-shadow:var(--shadow-sm)}
/* Mietrecht-Urteile */
.urt-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.urt-intro{font-size:12.5px;line-height:1.55;color:var(--muted);text-align:center;max-width:600px;margin:2px auto 6px;padding:0 4px}
.urt-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:15px 16px;width:100%;max-width:620px;margin:0 auto;box-shadow:var(--shadow-md)}
.urt-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:9px}
.urt-az{font-size:11.5px;font-weight:700;color:#fff;background:var(--grad);padding:3px 9px;border-radius:8px}
.urt-date{font-size:11.5px;color:var(--muted);font-weight:600}
.urt-tag{margin-left:auto;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em}
.urt-tag.v{background:rgba(22,163,74,.14);color:#16a34a}
.urt-tag.m{background:rgba(37,99,235,.16);color:var(--brand)}
.urt-tag.p{background:rgba(217,119,6,.17);color:#d97706}
.urt-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.35;letter-spacing:-.01em;margin-bottom:6px}
.urt-body{font-size:13.5px;line-height:1.55;color:var(--text)}
.urt-body b{color:var(--brand-ink)}
/* scrollbars */
#chat::-webkit-scrollbar,.chips::-webkit-scrollbar,.witz-wrap::-webkit-scrollbar,.urt-wrap::-webkit-scrollbar{width:8px}
#chat::-webkit-scrollbar-thumb,.chips::-webkit-scrollbar-thumb,.witz-wrap::-webkit-scrollbar-thumb,.urt-wrap::-webkit-scrollbar-thumb{background:rgba(100,116,139,.25);border-radius:8px}
/* dark */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0f1c;--bg2:#0d1424;--surface:#151d2e;--surface-2:#1b2740;
    --text:#e8edf7;--muted:#93a1b8;--border:#28324a;
    --brand:#60a5fa;--brand-ink:#bfdbfe;
    --grad:linear-gradient(135deg,#3b82f6 0%,#6366f1 100%);
    --grad-soft:linear-gradient(135deg,#172554 0%,#1e1b4b 100%);
    --ring:rgba(96,165,250,.3);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 6px 20px rgba(0,0,0,.5);--shadow-lg:0 16px 44px rgba(0,0,0,.6);
  }
  .msg.user,.chip.cat,.sendbtn,.witz-btn:not(.secondary){color:#fff}
}
/* Formatierte Bot-Antworten */
.msg.bot{white-space:normal}
.msg.bot>*:first-child{margin-top:0}
.msg.bot>*:last-child{margin-bottom:0}
.ml-sp{height:7px}
.ml-h{font-weight:750;letter-spacing:-.01em;margin:11px 0 3px}
.ml-p{margin:4px 0}
.ml-li{position:relative;padding-left:16px;margin:4px 0}
.ml-li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.ml-step{display:flex;gap:9px;align-items:flex-start;margin:5px 0}
.ml-num{flex:0 0 auto;min-width:21px;height:21px;padding:0 5px;border-radius:7px;background:var(--grad);color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
/* Aktionen: Kopieren + Feedback */
.fb-grp{display:inline-flex;align-items:center;gap:8px}
.fb-copy{width:auto!important;padding:0 11px;font-size:12px;font-weight:600;color:var(--brand-ink)}
.fb-copy.fb-copied{color:#16a34a;border-color:#16a34a}
/* Copyright-Fußzeile */
.foot{flex-shrink:0;text-align:center;font-size:10.5px;line-height:1.4;color:var(--muted);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--border)}
/* Desktop: als gerahmte App-Karte zentrieren */
@media (min-width:680px){
  body{display:flex;align-items:center;justify-content:center;padding:24px;inset:0}
  #shell{height:calc(100dvh - 48px);max-height:880px;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
}
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="avatar">🗂️</div>
    <div class="htxt">
      <h1>Ablauf-Assistent</h1>
      <div class="status"><span class="dot"></span>Wohnraumverwaltung</div>
    </div>
    <button class="hdr-btn" id="resetBtn" onclick="resetChat()" aria-label="Gespräch neu starten" title="Gespräch neu starten">↺</button>
  </header>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="assist" type="button" onclick="switchTab('assist')">💬 Assistent</button>
    <button class="tab" data-tab="urteil" type="button" onclick="switchTab('urteil')">⚖️ Urteile</button>
    <button class="tab" data-tab="witz" type="button" onclick="switchTab('witz')">🎭 Witz</button>
  </div>
  <div id="assistView" class="view">
    <div id="chat" role="log" aria-live="polite" aria-atomic="false" aria-label="Chatverlauf"></div>
    <div class="chips" id="chips" role="group" aria-label="Themenvorschläge"></div>
    <div class="inputbar">
      <textarea id="ta" rows="1" placeholder="Frage eingeben…" aria-label="Frage eingeben" onkeydown="onKey(event)" oninput="autoGrow(this)"></textarea>
      <button class="sendbtn" id="sendBtn" onclick="sendMsg()" aria-label="Nachricht senden">➤</button>
    </div>
  </div>
  <div id="witzView" class="view hidden">
    <div class="witz-wrap">
      <div class="witz-card">
        <div class="witz-label">🎭 Witz des Tages</div>
        <div class="witz-date" id="witzDate"></div>
        <div class="witz-text" id="witzText"></div>
        <div class="witz-count" id="witzCount"></div>
      </div>
      <div class="witz-actions">
        <button class="witz-btn" type="button" onclick="nextWitz()">😄 Nächster Witz</button>
        <button class="witz-btn secondary" type="button" onclick="todayWitz()">📅 Zurück zum Tageswitz</button>
      </div>
    </div>
  </div>
  <div id="urteilView" class="view hidden">
    <div class="urt-wrap" id="urtWrap"></div>
  </div>
  <div class="foot">Bot &amp; Software © 2026 Karl Opelt</div>
</div>
<script>
/* Zentraler Verweis auf die Ablage der Ablauf-Dokumente */
const REF='V:\\4_Wohnraumverwaltung\\Verwaltung 2.0\\Abläufe';
const FILEHINT='\n\n📁 Datei/Details: '+REF;

/* ---------- Wissensbasis: Abläufe der Wohnraumverwaltung ---------- */
const FAQ=[
  {q:'Begrüßung',cat:'sys',kw:['hallo','hi','hey','moin','guten tag','servus'],
   a:'Hallo! 👋 Ich bin der Ablauf-Assistent der Wohnraumverwaltung – von Neuvermietung über Abnahme und Kaution bis Forderungen & Recht.\n\nWähle unten eine Kategorie oder stell direkt deine Frage. Die vollständigen Checklisten liegen unter:\n📁 '+REF},
  {q:'Was kann der Assistent?',cat:'sys',kw:['was kannst du','was kann der assistent','hilfe','wobei hilfst du','themen','übersicht','welche abläufe'],
   a:'Ich helfe bei den Abläufen der Wohnraumverwaltung, gegliedert in Kategorien:\n📄 Neuvermietung & Vertrag\n📋 Kündigung & Abnahme\n💰 Kaution\n🛠️ Nach Auszug / Instandsetzung\n⚖️ Forderungen & Recht\n🗂️ Organisation & Ablage\n💻 IT & System\n\nWähle unten eine Kategorie oder stell direkt deine Frage (z.B. „Kaution auflösen", „Aufzug", „Outlook-Abwesenheit").\nDie vollständigen Dateien: 📁 '+REF},
  {q:'Wo finde ich die Dateien?',cat:'ref',kw:['datei','dateien','pfad','ablage','wo finde ich','laufwerk','ordner','unterlagen','vorlage','checkliste datei'],
   a:'Die vollständigen Ablauf-Dokumente und Checklisten der Verwaltung liegen im Netzlaufwerk:\n\n📁 '+REF+'\n\nDort findest du u.a. die Checklisten zu Abnahme, Kautionskonto-Anlage und Kautionsauflösung.'},

  {q:'Abnahme (Rückgabe)',cat:'proz',kw:['abnahme','rückgabe','rücknahme','abnahmeprotokoll','wohnung abnehmen','auszug','abnahmetermin'],
   a:'Ablauf „Abnahme" (Rückgabe der Wohnung):\n\nVorbereitung (Assist):\n• Unterlagen zusammenstellen: Mietvertrag, Sanierungen/Modernisierungen der letzten 5 Jahre, erteilte Genehmigungen, Übergabeprotokoll, Fotos\n• Abnahmeprotokoll fertigen / Zähler klären\n• Bauschließung / Kellerschloss aus der Bauabteilung besorgen\n• ggf. Fahrzeug buchen / Fahrplan / Zeitdauer\n• geprüft (Verw)\n\nAbnahmetag (Verw):\n• Kurze Objektbesichtigung (Eingang, Außenfläche, Klingel, Briefkästen, Aufzug, Treppenhaus)\n• Sichtung der Mieteinheit auf Mängel anhand der Unterlagen\n• Prüfung Technik (DLE, Hebeanlage, Rauchwarnmelder, …)\n• Gängigkeit von Türen, Fenstern, Jalousien prüfen\n• Schlosstausch inkl. Schlüsselprüfung (ACHTUNG: auch Briefkasten!)\n\nNachbearbeitung:\n• Rücknahmeergebnis bekanntgeben an Vertrieb, BeKo (ggf. Müll abmelden), Eigentümer, externe Dienstleister (Verw)\n• Abnahmeprotokoll anhand Checkliste bearbeiten (Assist)\n• Schlüsselaufbewahrung (Assist)\n• geprüft (AbtL)'+FILEHINT},

  {q:'Abnahmeprotokoll vorbereiten',cat:'proz',kw:['abnahmeprotokoll vorbereiten','protokoll vorbereiten','vorbereiten','protokoll drucken','abnahmeprotokoll drucken','protokoll ausdrucken','re80'],
   a:'Ablauf „Abnahmeprotokoll vorbereiten":\n\nVorbereitung (Assist):\n• RE80 – Mietvertrag aufrufen\n• OPCC-Schnittstelle → Protokolle\n• Anzahl der Räume bestimmt die Ansteuerung/Seitenzahl des Protokolls\n\nDurchführung (Assist):\n• Zähler anhand Übergabeprotokoll prüfen\n• Protokoll ausdrucken (Protokolldrucker!)\n\nNacharbeit (Assist):\n• Übergabeprotokoll heraussuchen\n• Mögliche Bauverpflichtungen (vermieter- und mieterseits) heraussuchen\n• Herausgegebene Schlüssel klären (ggf. genehmigte/verlustige) + Schlüsselnummern\n• Prüfen: Wo befinden sich die Zähler?\n• Mögliche bauliche Genehmigungen (Umbau Bad, Markise, …)\n• Weiter mit: Abnahme'+FILEHINT},

  {q:'Kautionskonto anlegen + Referenznummer',cat:'proz',kw:['kautionskonto anlegen','kautionskontenanlage','referenznummer','kaution anlegen','hausbank','kautionskonto','konto anlegen','rückbaukaution','kautionspfand'],
   a:'Ablauf „Kautionskonto anlegen (HBM) + Referenznummer":\nErforderlich bei: Kontenanlage nach Mietvertragsschluss (vor Versand des Begrüßungsschreibens), Rückbaukautionen im laufenden Mietverhältnis, Kautionspfand Schließmedien. Notwendig: HBM-Zugang + MV-Nummer.\n\n1. Bei der Hausbank München (HBM) anmelden (www.hausbank-muenchen.de); Startseite → links Reiter „Kautionskonto"; Wirtschaftseinheit + Objekt (WE-Nummer) ausfüllen.\n2. Wirtschaftseinheit + Objekt ausfüllen; über „Papier mit Sternchen" (oben links) Konto anlegen; Eingabe-Assistent: Ja.\n3. Kontoart + Kautionskontonummer unverändert lassen; Mietnummer = Mietvertragsnummer, Verfügungshinweis bleibt offen.\n4. Personendaten pflegen (Anrede, Vor-, Nachname, Geburtsdatum, Adresse); alle Vertragspartner anlegen.\n5. Grundkaution gem. Vertrag; Überzahlung – keine Eintragung; Fälligkeit = Mietbeginn; Ratenzahlung nur bei Wohnungen; Bankverbindung – keine Eintragung.\n6. Daten prüfen → Enter → Kautionsnummer generieren; Dokumentendruck (Überweisungsdaten).\n7. In SAP unter Referenznummer hinterlegen; Sicherheitseinbehaltsabrechnung; Ablage Mieterakte.'+FILEHINT},

  {q:'Kaution auflösen (Teil-/Gesamt)',cat:'proz',kw:['kaution auflösen','kautionsauflösung','teilauflösung','gesamtauflösung','kaution auszahlen','auszahlung kaution','kaution abrechnen','auflösen','auflösung','auszahlung','lösen','löse','zurückzahlen'],
   a:'Ablauf „Kaution auflösen":\n\nTeilauflösung (Wohnung):\n1. In SAP Mieter aufrufen; prüfen, ob Reno geleistet; HKA/BKA auf Guthaben/Nachforderung prüfen → Sicherheitseinbehalt (SE) festlegen.\n2. Reiter Partner: Verzugsanschrift prüfen (sonst in nscale unter Protokolle/Ableseprotokoll oder Verwalter fragen).\n3. Reiter Kautionen → Referenznummer kopieren; bei HM-Kautionen einloggen → Kautionsbuchungen → Auflösungen; Referenznummer einfügen.\n4. Teilauszahlung (alles außer SE), Betrag anpassen; Auflösung immer zum heutigen Tag.\n5. Buchungsdaten bearbeiten (Sternchen): Bankverbindung + Verwendungszweck (MV-Nr. + Teilkaution) → Übernehmen.\n6. Strg+P, Ansicht ausdrucken, mit Kautionsabrechnungsstempel stempeln.\n7. Schreiben in SAP: OPCC → Verwaltung 03-Kautionen → „Kautionsabrechnung mit SE und OP"; offene Posten prüfen; drucken und unterschreiben lassen.\n\nGesamtauflösung (Stellplatz, Keller, Garten):\nWie Teilauflösung, jedoch Gesamtauszahlung; Betrag prüfen; Schreiben „Kaution Abrechnung" (OPCC → Verwaltung 03-Kautionen); drucken und unterschreiben lassen.'+FILEHINT},

  {q:'Sicherheitseinbehalt (SE) bestimmen',cat:'proz',kw:['sicherheitseinbehalt','se bestimmen','se','einbehalt','sicherheits einbehalt'],
   a:'Sicherheitseinbehalt (SE) bestimmen:\n1. Mieter in SAP aufrufen.\n2. Schuldet der Mieter Reno? → Reno-Schreiben erstellen, warten bis die Arbeiten ausgeführt sind, dann SE. Keine Reno? → direkt SE.\n3. Heiz- und Betriebskostenabrechnungen der letzten Jahre prüfen:\n   • Guthaben → ca. 150–200 EUR einbehalten.\n   • Nachzahlung → 30 % auf die offene Forderung.\n4. Prüfen, ob Betriebskosten/HK angepasst wurden, ggf. anpassen.\n5. SE bestimmen.'+FILEHINT},

  {q:'Mietvertrag versenden',cat:'proz',kw:['mietvertrag versenden','mietvertrag verschicken','begrüßungsschreiben','mv versenden','vertrag versenden','mietvertrag rausschicken'],
   a:'Ablauf „Mietvertrag versenden":\n\nVorbereitung:\n• Unterlagen prüfen (Verw): Mietvertrag vorhanden; Daten in SAP korrekt (Vertragspartner, Mietbeginn, Miete); beidseitig unterzeichnet (Verw/GF).\n\nDurchführung (Assist):\n• Begrüßungsschreiben über SAP/OPCC fertigen\n• Vorlage zur Unterschrift\n• Unterlagen in nscale scannen\n• MV ösen\n• Versenden\n\nNacharbeit:\n• Übergabe vorbereiten: Schlüssel, Unterlagen, Kaution + 1. Miete vorhanden (Assist/Verw)\n• Übergabeprotokoll\n• Weiter mit: Fertigung Übergabeprotokoll'+FILEHINT},

  {q:'Kündigungsbestätigung',cat:'proz',kw:['kündigungsbestätigung','kündigung bestätigen','kündigung eingegangen','kündigung bearbeiten','kündigungseingang'],
   a:'Ablauf „Kündigungsbestätigung":\n\nVorbereitung:\n• Kündigung prüfen (Assist): Originalunterschrift, alle Mieter unterzeichnet\n• Prüfung Kündigungsausschluss\n• Terminklärung Abnahme\n\nDurchführung:\n• Kündigungsbestätigung über SAP/OPCC fertigen (Assist)\n• Eckdatenblatt, Kündigungsbestätigung, Kündigung in gelbe Mappe\n• Mietspiegel nach Ausstattung online berechnen (Verw)\n• Prüfung sichere Miete\n• Prüfung und Unterzeichnung\n• Unterzeichnung GF (GF)\n• nscale-Scan und Versand (Assist)\n\nNacharbeit:\n• Kopie an Vertrieb und BeKo (Assist)\n• Mietspiegel und gesicherte Miete an Vertrieb\n• Wiedervorlage vier Wochen vor Abnahme\n• Weiter mit: Prozess Abnahme'+FILEHINT},

  {q:'Vertragsaktivierung',cat:'proz',kw:['aktivierung','vertragsaktivierung','aktivieren','vertrag aktivieren','vertrag scharf schalten','gegenzeichnung aktivierung'],
   a:'Ablauf „Vertragsaktivierung":\n\nEinfache Mietverträge (nach Gegenzeichnung, Verw):\n• Pflegen: Unterschrift Vermieter, Unterschrift Mieter, „Vermietet d. MA1 BH" (bei Maklervermietung „Vermietet d. Makler")\n• Kontrolle + Aktivierung (Stammpflege)\n\nBauO-Verträge:\n• Wie oben; bei Nachtragseingang (Verw): Konditionen, letzter Nachtrag vom\n• Kontrolle / Konditionsfreigabe + Aktivierung (Stammpflege)\n\nHauptmieterwechsel / Nachträge (ohne BauO):\n• Bei Nachtragseingang (Verw): Konditionen, letzter Nachtrag vom, „Vermietet d. MA1 BH"\n• Kontrolle / Konditionsfreigabe + Aktivierung (Stammpflege)\n\nGeplatzte Mietverträge:\n• Zeitnahe Mitteilung an die Stammdatenpflege (Verw)\n\nSonstiges:\n• Bei Nachträgen (außer BauO-Nachtrag): „Vermietet d. MA1 BH" mit Name des Nachtragserstellers anpassen\n• Pflege spätestens 48 Std. nach Erhalt; Aktivierung bis spätestens zum 9. eines Monats'+FILEHINT},

  {q:'MV/NT-Pflege nach Gegenzeichnung',cat:'proz',kw:['mv pflege','nt pflege','mv nt pflege','stammdatenpflege','nach gegenzeichnung','vertragspflege','klingelschild','klingelschilder','willkommensschreiben'],
   a:'Ablauf „MV/NT-Pflege nach Gegenzeichnung" (ohne Bauoption):\n\nVorarbeit (Ass, binnen 48 Std.):\n• Prüfen auf Vollständigkeit\n• Prüfen: alle korrekt gegengezeichnet und i.V.-Stempel gesetzt\n\nStammdatenpflege (Verw):\n• Individuelle Stammdaten pflegen (Unterschriftsdatum, Konditionen, Mietanpassungsart, Kaution)\n• Anlage Kautionskonto\n\nSonstiges (Ass):\n• Klingelschilder – Berlin: über die Master-Datei im Gruppenordner (…\\Klingelschilder\\Klingelschildbestellungen_MASTER.xlsm); Dresden: macht der Vertrieb; Hamburg: über den externen Dienstleister\n• Vorbereitung Übergabeprotokoll\n• Willkommensschreiben\n\nNacharbeit (Ass):\n• Unterlagen im Konvolut zu nScale\n• Unterlagen nieten und versenden\n• Vermieter-Exemplar an die Stammdatenprüfung übergeben'+FILEHINT},

  {q:'Renovierungsaufforderung (ReNo)',cat:'proz',kw:['renovierungsaufforderung','reno','reno erstellen','renovierung auffordern','mängelbeseitigung aufforderung'],
   a:'Ablauf „Renovierungsaufforderung (ReNo)":\n\nErstellen:\n1. Mietvertrag prüfen (Was wurde vereinbart?)\n2. Abnahmeprotokoll mit Übergabeprotokoll vergleichen\n3. ReNo erstellen (OPCC → Mietvertrag → Renovierungsaufforderung); es gibt eine Word-Vorlage im Ablage-Ordner\n4. ReNo als Word-Dokument speichern und ausdrucken\n5. Protokoll und Eckdatenblatt ausdrucken\n6. Alles in die rote Mappe, zur Unterschrift nach oben\n7. Fachabteilung per E-Mail informieren\n8. ReNo in den Kalender eintragen und verfolgen\n\nInfo an die Fachabteilung:\n• Kopie der ReNo + Link mit Bildern\n• Kurzer Text über Mieteinheit und Zustand\n• E-Mail an die Vermietung, CC an die zuständige Fachabteilung\n• Betreff: „Abnahme zum …"'+FILEHINT},

  {q:'Kostenschätzung',cat:'proz',kw:['kostenschätzung','kosten schätzen','reno kosten','schönheitsreparatur','kondition pflegen','ablehnung reno'],
   a:'Ablauf „Kostenschätzung":\n\n1) Kostenschätzung erstellen:\n• Gelbe Mappe vorbereiten; Eckdatenblatt ausdrucken\n• ReNo-Datei und Kostenschätzung öffnen; Muster-Kostenschätzung öffnen\n• Kosten aus der Tabelle heraussuchen; Bezeichnung/Rubrik eintragen\n• Tabelle ausdrucken und speichern\n\n2) Schreiben erstellen:\n• OPCC → Mietvertrag → Ablehnung Reno (Betrag immer netto; Frist + 2 Wochen)\n• Anschreiben ausdrucken; in die gelbe Mappe zur Unterschrift\n• Frist in den Kalender eintragen und verfolgen\n\n3) Kondition in SAP pflegen:\n• Kondition erstellen (Schönheitsreparatur 2090; gültig ab Anfang bis Ende des letzten Monats)\n• E-Mail an die zuständigen Stellen (Buchhaltung/Konditionen)'+FILEHINT},

  {q:'Arbeitsmappen (Mappenfarben)',cat:'proz',kw:['mappe','mappen','mappenfarbe','farbe mappe','welche mappe','arbeitsmappe','grüne mappe','gelbe mappe','rote mappe','lila mappe','weiße mappe'],
   a:'Arbeitsmappen – welche Farbe wofür:\n\n🟢 Grün – Vertragsunterlagen (Papier-Mieterakte): Mietverträge, Nachträge, Bürgschaften, Zwangsvollstreckungsunterwerfungen, Sparbücher. In der Bearbeitung grundsätzlich in grünen Mappen belassen; pro Mappe nur ein Vorgang.\n\n🟡 Gelb – Unterschrifts-Dokumente, EILT (Unterschrift noch am selben Tag): Kündigungen, Abmahnungen, Aufforderungen zur Mängelbeseitigung, Mietanpassungen (Eckdatenblatt als Deckblatt), Renovierungsaufforderungen.\n\n🔴 Rot – Unterschrifts-Dokumente: Kündigungsbestätigungen (Eckdatenblatt mit Hinweis), Hinweis-/Informationsschreiben (kann am Folgetag versandt werden).\n\n🟣 Lila – Zahlungstitel gegen uns: Urteile, Kostenfestsetzungsbeschlüsse. Forderungsmanagement bereitet vor; nach Verwalterbearbeitung zur Geschäftsführung zur Freizeichnung.\n\n⚪ Weiß – Personal, hoch vertraulich: nicht lesen, direkt zu HR.'+FILEHINT},

  {q:'Aufhebungsvereinbarungen',cat:'proz',kw:['aufhebungsvereinbarung','aufhebung','mietaufhebung','vertrag aufheben','austrittskonditionen','aufhebungspauschale'],
   a:'Umgang mit Aufhebungsvereinbarungen (Anbahnung):\n• Die Abteilungsleitung ist bereits früh bei der Anbahnung einer Aufhebung einzubinden.\n• Mietpreisbremse: Um sich im Folgemietverhältnis auf die vorherige Miete berufen zu können, muss diese ein Jahr rechtswirksam vereinbart gewesen sein. Bittet der Mieter innerhalb des ersten Jahres um Aufhebung und wurde die Miete nicht schon vom Vormieter geleistet, kann einer Aufhebung + Neuvertrag nicht zugestimmt werden – in Betracht kommt dann höchstens Mieteintritt des neuen / Mietaustritt des alten Mieters, nur nach Rücksprache mit Abteilungsleitung Verwaltung/Vertrieb bzw. Geschäftsführung.\n• Vor Mietpreisabfrage/Anfrage der Austrittskonditionen ist der Mietvertrag sorgfältig zu prüfen – ausschließlich durch die Verwaltung.\n• Sonderkonditionen beachten: Ein bei fristloser Kündigung rückforderbarer Mieterlass ist bei Aufhebung nicht rückforderbar – das wirtschaftlich in der Aufhebungspauschale berücksichtigen.\n• Zuständigkeiten einhalten und sorgfältig prüfen.'+FILEHINT},

  {q:'Buchung von Titeln (Forderungen gegen uns)',cat:'proz',kw:['titel buchen','titelforderung','forderung gegen uns','buchung titel','zahlung titel','vollstreckbarer titel','titeleingang','zahllauf'],
   a:'Ablauf „Buchungen/Zahlungen auf Titelforderungen (gegen Vermieter/Eigentümer)":\n\nTiteleingang (Rechtsabteilung):\n• Fristennotierung + Überwachungsliste (Excel)\n• Ausdruck + Kontierungsstempel (2 Tage; Eskalation Abtl. Verwaltung)\n• Zahlungsfreigabe (GF; 8 Tage)\n\nTitelprüfung (Verwaltung / Mietenbuchhaltung / Datenpflege):\n• Excel Sollstellungsänderung erstellen und prüfen\n• SAP pflegen und Pflege prüfen\n• Klärung Berufung; ggf. Aufrechnung (SAP/OPCC)\n• Titelablage in nScale; Freigabe Kondition (SAP)\n• Sollstellung (Controlling; 7 Tage)\n\nZahlung (Mietenbuchhaltung):\n• Zinsberechnung (Basiszins), Gegenbuchung zur Sollstellung\n• Zahllauf über Debitor vorbereiten und freigeben\n• Ablage Zahllauf in nScale (14 Tage; Eskalation GF)\n\nNacharbeit (Rechtsabteilung / MiBu):\n• Hinweis an Verwaltung, externen RA und Rechtsabteilung über die Zahlung (E-Mail)\n• Abforderung des vollstreckbaren Titels\n• Endkontrolle + SAP-Pflege (Mahn/Klage, Mietenkonto, Wiedervorlagen)\n• Streichung Frist/Überwachungsliste'+FILEHINT},

  {q:'Hinweise für Abnahmen',cat:'proz',kw:['hinweise abnahme','tipps abnahme','abnahme hinweise','einbauten entfernen','abgenutzt defekt','worauf achten abnahme','worauf','briefkastenschlüssel'],
   a:'Hinweise für Abnahmen (Praxis):\n• Einbauten sind vom Mieter zu entfernen (Lampen, Badutensilien, Kücheneinbauten, Einbauschränke) – auch wenn er sagt, sie waren bei Übergabe schon drin (i.d.R. in sein Eigentum übergegangen).\n• Unterschiedliche Bodenbeläge (v.a. Teppich) mit dem Übergabeprotokoll abgleichen und den Mieter ansprechen. Zurechtgemachte Wohnungen haben außer Küche/Bad überall den gleichen Belag.\n• Übernommene Einbauküche auf Funktion prüfen; Lebensmittel entfernt der Mieter (bei der Abnahme mitteilen).\n• Toilette und Waschbecken sauber übergeben – sonst zur sofortigen Reinigung auffordern.\n• Briefkastenschlüssel testen; Foto der Briefkastenanlage mit steckendem Schlüssel machen.\n• Fenster, Jalousien und Zimmertüren auf Gängigkeit prüfen.\n• Farbige Wände: dezente Farben akzeptieren, aber nur wenn der ganze Raum in einem Ton gestrichen ist – sonst Nachbesserung anmerken.\n• Im Protokoll sparsam mit „abgenutzt": grundsätzlich „defekt" ankreuzen; „abgenutzt" nur, wenn der Mieter es fordert und es echte Abnutzung ist (z.B. Laufspuren im Bodenbelag).'+FILEHINT},

  {q:'Mietvertragsbearbeitung (ohne BauO)',cat:'proz',kw:['mietvertragsbearbeitung','mv bearbeitung','mietvertrag bearbeiten','vertrag bearbeiten','unterschriebener mietvertrag','deckblatt'],
   a:'Ablauf „Mietvertragsbearbeitung (ohne BauO)" – MV kam unterschrieben von der Geschäftsleitung:\n1. Vorbereitung zur Unterschrift (grüne Mappe)\n2. Vollständigkeit der Unterlagen + Unterschriften prüfen\n3. Freigabe der Geschäftsführung über Laufwerk F: als Deckblatt ausdrucken\n4. Stempeln + Datum einsetzen, dann zur Prüfung an die Abteilungsleitung\n5. Prüfen, ob die Geschäftsleitung überall unterschrieben hat\n6. Individuelle Stammdaten pflegen (Unterschriftsdatum, Konditionen, Mietanpassungsart, Kaution) – siehe Handout MV-Pflege\n7. Kautionskonto bei der Hausbank München (HBM) anlegen – siehe Handout HBM\n8. Klingelschilder bestellen (Berlin: Master-Datei im Gruppenordner; Dresden: Vertrieb; Hamburg: über den externen Dienstleister)\n9. Protokolle vorbereiten (Whg/Keller/TG), ggf. mit Grundriss und §8-Auszug\n10. Willkommensschreiben (Wohnen/Keller/Tiefgarage) über OPCC_07_Mietvertrag erstellen + unterschreiben\n11. Unterlagen im Konvolut zu nScale scannen\n12. Unterlagen nieten + versenden\n13. Unser Exemplar bleibt in der grünen Mappe\n14. Eckdatenblatt ziehen\n15. Eckdatenblatt + Mietvertrag stempeln „SAP eingepflegt" + links unterschreiben\n16. Übergabe zur Prüfung + Freigabe an die Stammdatenprüfung'+FILEHINT},

  {q:'Mahnlisten-Abkürzungen',cat:'proz',kw:['mahnliste','mahnlisten','mahnkennzeichen','kennzeichen','mahnsperre','abkürzung mahn','mahnlauf'],
   a:'Mahnlisten – Kennzeichen (Bedeutung):\n• „S" – kein Abmahnschreiben (z.B. wir warten auf kündigungsrelevanten Rückstand oder eine Mietminderung ist noch zu klären).\n• „M" – Mahnbescheid gewünscht; überführt das Mietverhältnis per Nachtroutine als Forderungsakte nach AnnoText.\n• „K" – Mahnbescheid beantragt oder Klage eingereicht (Kopie Antrag/Klage vorlegen).\n• „T" – Forderung rechtskräftig tituliert (Kopie Urteil → Mahnsperre).\n• „R" – Forderung zur Prüfung beim Rechtsanwalt, Klage noch nicht eingereicht.\n• „I" – Mieter insolvent, Forderung beim Insolvenzverwalter angemeldet (→ Mahnsperre).\n• „V" – Guthaben zugunsten des Mieters, aber keine Bankverbindung mitgeteilt (Mahnsperre; nach Verjährung vereinnahmen).\n• „X" – einmalige Aussetzung, wenn der Verwalter kurzfristig etwas klären möchte; beim nächsten Mahnlauf wieder entfernt.\n• „C" – Betriebs-/Heizkostenabrechnungen (automatisch bei Erstellung der NK-Abrechnungen).'+FILEHINT},

  {q:'Indexpflege & Lastschrift-Sperren',cat:'proz',kw:['index','indexpflege','indexstand','indexlauf','indexläufe','indexanpassung','lastschriftlauf','sperre lastschrift','sperrensetzung'],
   a:'Ablauf „Indexpflege, Indexläufe & Sperren für den Lastschriftlauf":\nZiel: ordnungsgemäße Indexanpassungen und korrekte Berücksichtigung im Lastschriftlauf.\n\n1. Pflege des Indexstandes – erfolgt zentral durch die zuständige Stelle (Stammdaten/MiBu).\n2. Durchführung der Indexläufe – die zuständigen Verwalter führen die Indexläufe eigenständig durch.\n3. Meldung an die Mietenbuchhaltung – Verwalter melden alle von einer Indexanpassung betroffenen Verträge.\n4. Sperrensetzung für den Lastschriftlauf – die Mietenbuchhaltung veranlasst auf Basis der Meldungen die erforderlichen Sperren, damit die angepassten Mieten korrekt verarbeitet werden.\n\nVerantwortlich: Indexstand = zentrale Stelle; Indexläufe + Sperren indexierter Verträge = Verwalter; Umsetzung der Sperren im Lastschriftlauf = Mietenbuchhaltung.\n\n📄 Arbeitsanweisung MiBu: G:\\Verwaltung\\Schulungsunterlagen\\Indexanpassung_Mietenbuchhaltung'+FILEHINT},

  {q:'Aufzug-Stillstand (Meldung & Nachverfolgung)',cat:'proz',kw:['aufzug','fahrstuhl','lift','aufzug stillstand','aufzug defekt','aufzugsstörung','stillstand','notliste'],
   a:'Ablauf „Aufzug-Stillstand – Meldung & Nachverfolgung":\n\nMeldung:\n1. Notruf geht ein (alle Abteilungs-MA; Telefon/Mail)\n2. Meldung an den Servicepartner (Tel + Mail; Aufzugsliste) – unverzüglich\n3. Aufnahme in die Notliste (Excel) – unverzüglich\n4. Weiterleitung an Verwaltung + E-Mail-Verteiler – noch am selben Tag\n5. Mieterinformation über den Stillstand (Verwalter, Mail)\n6. Prüfung der Mieterliste (Besonderheiten, z.B. Alter) + Info an die technische Verwaltung – noch am selben Tag\n\nNachfassen bis zur Erledigung:\n• Zuständigkeit Telefonabfrage abstimmen (täglich bis 9:30)\n• Telefonische Abfrage beim Servicepartner (11:00–11:30; Notliste)\n• Rücksprache Verwaltung, ggf. Mieterinformation (bis 12:30)\n• Zwischenstand an den E-Mail-Verteiler (bis 12:00)\n• Ergebnis in der Notliste aufnehmen (bis 14:00)\n• „Aufzug fährt" – Erledigung kennzeichnen (bis 14:00)\n\nHinweise:\n• Notliste: vom Verwalter zu prüfen; Meldungen werden nicht gelöscht (Prüfung von Häufungen).\n• Aufzugsliste/Servicepartner: Pflege durch eine neutrale Stelle.\n• Schulungen: Grundschulung jedes Abt.-Mitarbeiters in der ersten Woche; alle 8 Wochen Nachschulung durch die Abteilungsleitung.'+FILEHINT},

  {q:'Leerstand Strom (An-/Abmeldung)',cat:'proz',kw:['leerstand','strom','stromanmeldung','stromabmeldung','strom melden','strom abmelden','strom anmelden','vattenfall','zählerstand strom'],
   a:'Leerstandsan- und -abmeldung Strom (Vorlagen):\n\n📤 ABMELDUNG (neuer Mieter zieht ein – Einheit nicht mehr in unserem Besitz):\nFelder: Neuer Mieter · Zähler · Lieferstelle · Lage der Mieteinheit.\nText: „… wir teilen Ihnen mit, dass die oben bezeichnete Mieteinheit sich seit dem XX.XX.202X aufgrund Mietvertragsbeginn nicht mehr in unserem Besitz befindet. Der Zählerstand bei Übergabe beträgt ausweislich des beigefügten Protokollauszugs X.XXX kWh. Bitte wenden Sie sich zur Vertragsanbahnung an den oben benannten Mieter, der unter der Lieferstelle postalisch erreichbar ist."\n\n📥 ANMELDUNG (Einheit fällt an uns zurück / Leerstand):\nFelder: Eigentümer · Zähler · Lieferstelle · Lage der Mieteinheit · Vormieter.\nText: „… wir teilen Ihnen mit, dass die oben bezeichnete Mieteinheit sich seit dem XX.XX.202X wieder in unserem Besitz befindet. Der Zählerstand bei Übernahme beträgt ausweislich des beigefügten Protokollauszugs X.XXX kWh. Da sich die Mieteinheit im Leerstand befindet, ist kein Stromverbrauch zu erwarten; es wird um Niederschlagung möglicher Abschlagszahlungen gebeten. Rechnungsempfänger ist der Eigentümer."'+FILEHINT},

  {q:'Arbeitstagsablauf (morgens)',cat:'proz',kw:['arbeitstagsablauf','tagesablauf','morgens','arbeitsaufnahme','dok@web','dokweb','tagesbeginn','reihenfolge morgens','was zuerst'],
   a:'Arbeitstagsablauf – morgens nach Arbeitsaufnahme zuerst bearbeiten:\n1. Grüne Mappen (Neuverträge, Nachträge etc.)\n2. Lila Mappen (Zahlungstitel gegen uns …)\n3. Neue Klageakten\n4. Dok@WEB einsehen und die dich/euch betreffenden Rechnungen bearbeiten (nach WE filterbar)\n\nWichtig: Dok@WEB nicht sammeln, sondern einmal täglich (morgens) reinschauen und abarbeiten – sonst entsteht in anderen Abteilungen Stau. Danach bleibt genügend Zeit fürs Tagesgeschäft.'+FILEHINT},

  {q:'Öffentlichen Ordner einbinden (Outlook)',cat:'proz',kw:['öffentlicher ordner','öffentliche ordner','outlook ordner','ordner einbinden','favoriten','ordneransicht','mailansicht'],

   a:'Vollstreckbare Titel gegen uns – Zwangsvollstreckung vermeiden:\n\nHintergrund:\n• Ein vollstreckbarer Titel (Urteil, KFB = Kostenfestsetzungsbeschluss oder gerichtlicher Vergleich) erlaubt dem Gegner, über den Gerichtsvollzieher die Zwangsvollstreckung einzuleiten – auch ohne vorherige Zahlungsaufforderung.\n• Meist ergehen zwei Titel (Zahlungsurteil + KFB). Ziel: nicht abwarten, sondern zahlen, sobald der rechtskräftige Titel eingeht.\n\nAblauf:\n1. Anweisung an die Kanzleien: Alle Titel (Urteile, KFBs, Vergleiche) werden zusätzlich zum bisherigen Verteiler an das zentrale Titel-Postfach geschickt.\n2. Interne Regel: Wer einen Titel erhält und nicht sicher ist, ob er schon weitergeleitet wurde, leitet ihn an das zentrale Titel-Postfach weiter.\n3. Titel per Post: Die Assistenz der Geschäftsführung leitet nach dem Scannen zusätzlich an das Titel-Postfach weiter.\n4. Bearbeitung und federführende Verantwortung bleiben wie bisher beim Verwalter.\n5. Das Titel-Postfach wird von der zuständigen Stelle (Forderungsmanagement) gelesen; Titel werden in einer Excel-Liste (Ampel) erfasst.\n\nAmpel „erledigt" erst, wenn: bezahlt wurde ODER die Zwangsvollstreckung mit Sicherheitsleistung abgewendet wurde (selten, z.B. für eine Berufung → Wiedervorlage 3 Monate) ODER die Gegenseite auf die Vollstreckung bis auf weiteres verzichtet hat.'+FILEHINT},

   a:'Ablauf „Widersprüche Betriebs-/Heizkosten (NKA)":\nAblage: alle Widersprüche & Belegeinsichtsforderungen bearbeitet die Fachabteilung Betriebskosten im Ordner G:\\2_Scan\\Widersprüche-Nebenkosten (nicht in Unterordner).\n\n1. Tagespost (inkl. NKA-Widersprüche) in nscale scannen und den Verwalterteams zuordnen.\n2. Unsubstantiierter Widerspruch / pauschale Einwände: Empfänger weist zurück, informiert die andere Fachabteilung + den Mietbuchhalter (Mail cc; Post einscannen), fordert bei Nachforderung weiter Zahlung, legt Widerspruch + Zurückweisung in nscale ab (Mieterakte → Nebenkosten → Unbegründeter Widerspruch). Textbausteine in SAP (Schnittstelle Nebenkosten). KEINE Mahnsperre.\n3. Substantiierter Widerspruch (konkrete Einlassung / Belegeinsicht) an die NK-Abteilung: in nscale ablegen (Mieterakte → Nebenkosten → Widersprüche Eingang), Datei benennen JJJJMMTT_Widerspruch + BK/HK + Jahr (z.B. 20251118_Widerspruch BK 2024), Verwalter + Mietbuchhalter informieren (Zuständigkeit: BH-Liste). Mietbuchhalter setzt Mahnsperre „B".\n   • Antwort bis 15. des Monats → Sperre raus (nächster Mahnlauf mahnt bei Nichtzahlung).\n   • Antwort nach dem 15. → Posten bleibt einen Mahnlauf länger gesperrt (Buchhalter per WV, nach Mahnlauf Sperre entfernen).\n4. Substantiierter Widerspruch an den Verwalter: an die Fachabteilung Betriebskosten weiterleiten = Datei im Ordner G:\\2_Scan\\Widersprüche-Nebenkosten speichern (benannt Buchungskreis_MV-Nr_Mietername + BK/HK); zusätzlich in nscale unter Nebenkosten Widersprüche ablegen.\n\nThemenbezogen an den Verwalter (prüft/klärt): Höhe der Vorauszahlungen, Verwalterkostenpauschale, Mietvertragsbeginn/-ende; Ratenzahlungswunsch (prüft, klärt mit GF; ggf. notarielles Schuldanerkenntnis in vollstreckbarer Ausfertigung).\n\nEskalation: Buchhalter + Verwalter informieren die GF, wenn die Mahnsperre „B" länger als 6 Monate auf einem Posten sitzt.\nNachbereitung: Der NK-Sachbearbeiter organisiert innerhalb von 4 Wochen nach Versand jeder abge /* ---------- Matching ---------- */
const STOPWORDS=new Set(['ich','du','er','sie','es','wir','ihr','der','die','das','ein','eine','einen','einem','einer','wie','was','wann','wo','ist','sind','war','wird','muss','kann','mir','mich','dir','dich','zu','im','in','am','an','bei','für','und','oder','mit','auf','ab','habe','hat','hab','bitte','mal','denn','doch','noch','auch','nur','schon','meine','mein','meinen','wer','soll','möchte','will','brauche']);
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9äöüß\s]/g,' ').replace(/\s+/g,' ').trim();}
function contentWords(phrase){const w=normalize(phrase).split(' ').filter(Boolean);const c=w.filter(x=>!STOPWORDS.has(x));return c.length?c:w;}
function lev(a,b){/* Damerau (OSA): Buchstabendreher = 1 Fehler */
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  const d=[];for(let i=0;i<=m;i++){d[i]=new Array(n+1);d[i][0]=i;}for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];}
function wordPresent(w,tokens){
  if(tokens.has(w))return true;
  if(w.length<4)return false;
  for(const tk of tokens){if(tk.length>=4&&(tk.startsWith(w)||w.startsWith(tk)))return true;}
  if(w.length>=5){for(const tk of tokens){if(tk.length>=4&&Math.abs(tk.length-w.length)<=2&&lev(tk,w)<=(w.length>=10?2:1))return true;}}
  return false;
}
function rankMatches(text){
  const tokens=new Set(normalize(text).split(' ').filter(Boolean));
  return FAQ.map(f=>{let score=0;f.kw.forEach(k=>{const cw=contentWords(k);const hits=cw.filter(w=>wordPresent(w,tokens)).length;if(hits===cw.length&&hits>0)score+=hits;});return {f,score};}).sort((a,b)=>b.score-a.score);
}
function softRank(text){
  const tokens=new Set(normalize(text).split(' ').filter(Boolean));
  return FAQ.filter(f=>f.cat==='proz'||f.cat==='ref').map(f=>{let s=0;f.kw.forEach(k=>contentWords(k).forEach(w=>{if(wordPresent(w,tokens))s++;}));return {f,s};}).sort((a,b)=>b.s-a.s);
}

/* ---------- Chat-UI ---------- */
const chatEl=document.getElementById('chat'),chipsEl=document.getElementById('chips'),ta=document.getElementById('ta'),sendBtn=document.getElementById('sendBtn');
let history=loadHistory();
function loadHistory(){try{return JSON.parse(localStorage.getItem('va_chat'))||[];}catch(e){return [];}}
function saveHistory(){try{localStorage.setItem('va_chat',JSON.stringify(history.slice(-120)));}catch(e){}}
function logFeedback(v){try{const f=JSON.parse(localStorage.getItem('va_fb'))||{up:0,down:0};f[v?'up':'down']++;localStorage.setItem('va_fb',JSON.stringify(f));}catch(e){}}
function timeNow(){return new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtBot(text){
  return esc(text).split('\n').map(function(raw){
    var t=raw.trim();
    if(!t)return '<div class="ml-sp"></div>';
    if(/^[•·]/.test(t))return '<div class="ml-li">'+t.replace(/^[•·]\s*/,'')+'</div>';
    var m=t.match(/^(\d{1,2})[.)]\s+(.+)$/);
    if(m)return '<div class="ml-step"><span class="ml-num">'+m[1]+'</span><span>'+m[2]+'</span></div>';
    if(t.length<=70&&/:$/.test(t))return '<div class="ml-h">'+t+'</div>';
    return '<div class="ml-p">'+t+'</div>';
  }).join('');
}
function addMsg(role,text,save){
  if(save===undefined)save=true;
  const wrap=document.createElement('div');wrap.className='msg '+role;
  if(role==='bot')wrap.innerHTML=fmtBot(text);else wrap.textContent=text;
  chatEl.appendChild(wrap);
  const t=document.createElement('div');t.className='msg-time';t.style.alignSelf=role==='user'?'flex-end':'flex-start';t.textContent=timeNow();chatEl.appendChild(t);
  chatEl.scrollTop=chatEl.scrollHeight;
  if(save){history.push({r:role,t:text});saveHistory();}
}
function showTyping(){const el=document.createElement('div');el.className='typing';el.id='typingInd';el.innerHTML='<span></span><span></span><span></span>';chatEl.appendChild(el);chatEl.scrollTop=chatEl.scrollHeight;}
function hideTyping(){const el=document.getElementById('typingInd');if(el)el.remove();}
function addActions(text){
  const row=document.createElement('div');row.className='fb-row';
  const cp=document.createElement('button');cp.className='fb-btn fb-copy';cp.type='button';cp.textContent='📋 Kopieren';cp.setAttribute('aria-label','Antwort kopieren');cp.onclick=function(){copyText(text,cp);};
  const grp=document.createElement('span');grp.className='fb-grp';
  const q=document.createElement('span');q.className='fb-q';q.textContent='· War das hilfreich?';
  const up=document.createElement('button');up.className='fb-btn';up.type='button';up.textContent='👍';up.setAttribute('aria-label','Antwort war hilfreich');
  const down=document.createElement('button');down.className='fb-btn';down.type='button';down.textContent='👎';down.setAttribute('aria-label','Antwort war nicht hilfreich');
  up.onclick=function(){doFb(grp,true);};down.onclick=function(){doFb(grp,false);};
  grp.append(q,up,down);row.append(cp,grp);chatEl.appendChild(row);chatEl.scrollTop=chatEl.scrollHeight;
}
function copyText(t,btn){
  var done=function(){var o=btn.textContent;btn.textContent='✓ Kopiert';btn.classList.add('fb-copied');setTimeout(function(){btn.textContent=o;btn.classList.remove('fb-copied');},1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(function(){fallbackCopy(t,done);});}
  else fallbackCopy(t,done);
}
function fallbackCopy(t,done){try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);done();}catch(e){}}
function doFb(grp,ok){logFeedback(ok);const d=document.createElement('span');d.className='fb-done';d.textContent=ok?'✓ Danke!':'✓ Danke – Details siehe Netzlaufwerk.';grp.replaceWith(d);chatEl.scrollTop=chatEl.scrollHeight;}
function addSuggestions(intro,faqs){
  addMsg('bot',intro);
  const row=document.createElement('div');row.className='sugg-row';
  faqs.forEach(f=>{const b=document.createElement('button');b.className='sugg-btn';b.type='button';b.textContent=f.q;b.onclick=()=>{ta.value=f.q;sendMsg();};row.appendChild(b);});
  chatEl.appendChild(row);chatEl.scrollTop=chatEl.scrollHeight;
}

let chipMode='cats';
function mkChip(label,cls,fn){const c=document.createElement('button');c.type='button';c.className='chip'+(cls?' '+cls:'');c.textContent=label;c.onclick=fn;chipsEl.appendChild(c);}
function renderChips(){
  chipsEl.innerHTML='';
  if(chipMode==='cats'){
    CATS.forEach(cat=>mkChip(cat.emoji+' '+cat.label,'cat',()=>{chipMode=cat.key;addMsg('bot','Themen zu „'+cat.label+'" – wähle eins aus oder stell direkt deine Frage:');renderChips();}));
  }else{
    mkChip('← Kategorien','back',()=>{chipMode='cats';renderChips();});
    const cat=CATS.find(c=>c.key===chipMode);
    if(cat)cat.topics.forEach(q=>mkChip(q,'',()=>{ta.value=q;sendMsg();}));
  }
}
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function resetChat(){history=[];saveHistory();chatEl.innerHTML='';chipMode='cats';renderChips();addMsg('bot',FAQ[0].a);}

function sendMsg(){
  const text=ta.value.trim();
  if(!text)return;
  addMsg('user',text);
  ta.value='';autoGrow(ta);
  sendBtn.disabled=true;showTyping();
  setTimeout(()=>{
    hideTyping();
    const nt=normalize(text);
    if(nt.includes('witz')||nt.includes('joke')||nt.includes('lach')){
      addMsg('bot','😄 '+jokeOfTheDay()+'\n\nMehr davon findest du oben im Reiter „Witz des Tages".');
      sendBtn.disabled=false;return;
    }
    const ranked=rankMatches(text);
    const best=ranked[0];
    const clearLeader=best.score>=2||(best.score>=1&&(!ranked[1]||best.score>ranked[1].score));
    if(clearLeader){
      addMsg('bot',best.f.a);
      if(best.f.cat==='proz'||best.f.cat==='ref')addActions(best.f.a);
    }else{
      const soft=softRank(text).filter(x=>x.s>0).slice(0,3);
      if(soft.length)addSuggestions('Ich bin nicht ganz sicher, was du meinst. Meintest du vielleicht:',soft.map(x=>x.f));
      else addMsg('bot',FALLBACK[Math.floor(Math.random()*FALLBACK.length)]);
    }
    sendBtn.disabled=false;
  },450+Math.random()*350);
}

/* ---------- Witz des Tages ---------- */
function dayOfYear(d){const s=new Date(d.getFullYear(),0,0);return Math.floor((d-s)/86400000);}
function jokeIndexToday(){return dayOfYear(new Date())%WITZE.length;}
function jokeOfTheDay(){return WITZE[jokeIndexToday()];}
let witzIdx=0;
function renderWitz(){
  document.getElementById('witzText').textContent=WITZE[witzIdx];
  document.getElementById('witzDate').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  document.getElementById('witzCount').textContent='Immobilienwitz Nr. '+(witzIdx+1)+' von '+WITZE.length;
}
function todayWitz(){witzIdx=jokeIndexToday();renderWitz();}
function nextWitz(){witzIdx=(witzIdx+1)%WITZE.length;renderWitz();}
function switchTab(t){
  const map={assist:'assistView',urteil:'urteilView',witz:'witzView'};
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  for(const k in map){
    document.getElementById(map[k]).classList.toggle('hidden',k!==t);
  }
}
