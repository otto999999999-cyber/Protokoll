<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a5c8f">
<title>Prozess-Checklisten – Testfirma GmbH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--blue:#1a5c8f;--blue-mid:#2e7ab5;--blue-light:#e8f1f8;--border:#c8d6e0;--white:#fff;--green:#1a7a42;--field:#f2f3f5;--gray:#6b7c8d}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f4f8;color:#111;min-height:100vh}
header{background:var(--blue);color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
header a.back{color:#fff;text-decoration:none;font-size:22px;opacity:.9}
header h1{font-size:17px;font-weight:700;flex:1}
.progwrap{background:#1e4a70;height:6px}
.progfill{background:#5bb3f0;height:6px;width:0;transition:width .3s}
.sel{padding:12px 14px;background:#f0f4f8;border-bottom:1px solid var(--border)}
.sel select{width:100%;max-width:680px;margin:0 auto;display:block;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:16px;font-weight:700;color:var(--blue);background:var(--white);outline:none}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 40px}
.summary{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.summary .big{font-size:24px;font-weight:800;color:var(--blue)}
.summary .lbl{font-size:12px;color:var(--gray)}
.summary .acts{display:flex;gap:8px}
.summary button{background:var(--field);border:1.5px solid var(--blue);color:var(--blue);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:700;cursor:pointer}
.summary button.pdf{background:#1a5c3f;color:#fff;border-color:#1a5c3f}
.hdrcard{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
.hdrcard .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:#444;font-weight:600;margin:8px 0 4px}
.hdrcard input{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;font-size:15px;background:var(--field);color:#111;outline:none}
.hdrcard input:focus{border-color:var(--blue-mid);background:#fff}
.note{background:#fff8e6;border:1px solid #e8d5a0;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#7a5a00;margin-bottom:12px;font-weight:600}
.phase{background:var(--white);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden}
.phase h2{font-size:13px;font-weight:700;color:#fff;background:var(--blue);padding:10px 14px}
.item{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border-bottom:1px solid var(--field);cursor:pointer}
.item:last-child{border-bottom:none}
.item input{width:21px;height:21px;accent-color:var(--green);flex-shrink:0;margin-top:1px;cursor:pointer}
.item .txt{font-size:14px;line-height:1.4;flex:1}
.item.done .txt{text-decoration:line-through;color:var(--gray)}
.role{display:inline-block;font-size:10px;font-weight:700;color:var(--blue);background:var(--blue-light);border:1px solid var(--border);border-radius:8px;padding:1px 7px;margin-left:6px;white-space:nowrap;vertical-align:middle}
.legend{font-size:11px;color:var(--gray);margin-top:6px;line-height:1.6}
.done-banner{display:none;background:var(--green);color:#fff;text-align:center;padding:14px;border-radius:14px;font-weight:700;margin-bottom:12px}
.done-banner.show{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
:focus-visible{outline:2.5px solid #5bb3f0;outline-offset:2px}
@media (prefers-color-scheme: dark){
  :root{--blue-light:#1d2c3a;--border:#33404f;--white:#1b2430;--field:#232e3b;--gray:#8ba0b3}
  body,.sel{background:#0f1720;color:#e6edf3}
  .hdrcard input,.sel select{color:#e6edf3}
  label{color:#c5d2de}
  .note{background:#2a2410;border-color:#4a3f1a;color:#e8d5a0}
}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html" aria-label="Zurück zum Portal">←</a>
  <h1>Prozess-Checklisten</h1>
</header>
<div class="progwrap"><div class="progfill" id="prog"></div></div>
<div class="sel">
  <select id="procSel" aria-label="Prozess wählen" onchange="switchProc(this.value)"></select>
</div>
<div class="wrap">
  <div class="done-banner" id="banner">🎉 Alle Schritte erledigt!</div>
  <div class="summary">
    <div><div class="big"><span id="doneCount">0</span>/<span id="totalCount">0</span></div><div class="lbl">Schritte erledigt</div></div>
    <div class="acts">
      <button class="pdf" onclick="genPDF()">📄 PDF</button>
      <button onclick="resetProc()">Zurücksetzen</button>
    </div>
  </div>
  <div class="hdrcard" id="hdrcard"></div>
  <div class="note" id="note" style="display:none"></div>
  <div id="list"></div>
  <div class="legend">Rollen: <b>Assist</b> Assistenz · <b>Verw</b> Verwalter/in · <b>GF</b> Geschäftsführung · <b>BeKo</b> Betriebskosten. Prozesse anonymisiert (Rollen statt Namen).</div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* Header-Felder je Prozessinstanz */
const HDR=[['mvnr','MV-Nummer'],['mieter','Mietername'],['lieg','Liegenschaft'],['lage','Lage'],['datum','Datum']];
/* Prozesse (anonymisiert: Rollen statt Personennamen; interne Adressen generisch) */
const PROC={
 mietvertrag:{t:'Mietvertrag versenden',note:'',phases:[
   {t:'Vorbereitung',items:[
     ['Prüfung Unterlagen','Verw'],
     ['Mietvertrag (MV) liegt vor'],
     ['Daten korrekt in SAP (Vertragspartner, Mietbeginn, Miete)'],
     ['Beidseitig unterzeichnet','Verw/GF']]},
   {t:'Durchführung',items:[
     ['Begrüßungsschreiben über SAP/OPCC fertigen','Assist'],
     ['Vorlage zur Unterschrift'],
     ['Unterlagen in nscale scannen'],
     ['MV ösen'],
     ['Versenden']]},
   {t:'Nacharbeit',items:[
     ['Übergabe vorbereiten: Schlüssel, Unterlagen, Kaution + 1. Miete vorhanden','Assist/Verw']]},
   {t:'Weiter mit',items:[
     ['Eventuell Nachtrag']]}
 ]},
 kuendigung:{t:'Kündigungsbestätigung',note:'Kündigungseingang im Datum-Feld festhalten. Danach weiter mit Prozess „Abnahme“.',phases:[
   {t:'Vorbereitung',items:[
     ['Prüfung der Kündigung','Assist'],
     ['Originalunterschrift vorhanden'],
     ['Alle Mieter haben unterzeichnet'],
     ['Prüfung Kündigungsausschluss'],
     ['Terminklärung Abnahme']]},
   {t:'Durchführung',items:[
     ['Kündigungsbestätigung über SAP/OPCC fertigen','Assist'],
     ['Eckdatenblatt, Kündigungsbestätigung, Kündigung in gelbe Mappe'],
     ['Mietspiegel nach Ausstattung online berechnen','Verw'],
     ['Prüfung gesicherte Miete'],
     ['Prüfung und Unterzeichnung'],
     ['Unterzeichnung Geschäftsführung','GF'],
     ['nscale-Scan und Versand','Assist']]},
   {t:'Nacharbeit',items:[
     ['Kopie Kündigungsbestätigung an Vertrieb und BeKo','Assist'],
     ['Mietspiegel und gesicherte Miete an Vertrieb'],
     ['Wiedervorlage: vier Wochen vor Abnahme']]},
   {t:'Weiter mit',items:[
     ['Prozess Abnahme']]}
 ]},
 uebergabe:{t:'Übergabe an Mieter',note:'KEINE ZAHLUNGEN – KEINE ÜBERGABE. Termin frühestens drei Tage vor Vertragsbeginn.',phases:[
   {t:'Vor der Übergabe',items:[
     ['In SAP prüfen, ob sämtliche Zahlungen eingegangen sind'],
     ['Erste Monatsmiete (SAP-Übersicht)'],
     ['1. Rate der Kaution (Hausbank München)'],
     ['Kosten der Klingelbeschilderung (SAP-Übersicht)'],
     ['Übergabetermin vereinbaren (frühestens 3 Tage vor Vertragsbeginn)'],
     ['Zustandsprotokoll erstellen und drucken (OPCC „19 – Protokolle“)'],
     ['Abnahmeprotokoll drucken'],
     ['Besondere MV-Klauseln notieren'],
     ['Prüfen, ob alle Schlüssel des letzten Abnahmeprotokolls vorhanden sind']]},
   {t:'Während der Übergabe',items:[
     ['20 Min vor Termin da sein, Bauzylinder ausbauen und passenden Zylinder einbauen'],
     ['Bei mitvermietetem Keller: prüfen ob leer, Vorhängeschloss entfernen'],
     ['Zustand der Wohnung aufnehmen und protokollieren'],
     ['Schlüsselprotokoll ausfüllen und Schlüssel an Mieter übergeben'],
     ['Jede Seite des Zustandsprotokolls vom Mieter unterzeichnen lassen'],
     ['Dem Mieter die Durchdrucke aushändigen']]},
   {t:'Nach der Übergabe',items:[
     ['Übergabeprotokoll in nscale scannen'],
     ['Strom (Leerstand) abmelden (Vattenfall-Leerstandsportal)'],
     ['Protokollseiten 01–03 an BeKo weiterleiten (Drucker → Ableseprotokolle-Ordner)'],
     ['Ggf. aufgenommene Mängel an SFI melden'],
     ['Nachverfolgen, ob Mängel beseitigt wurden'],
     ['Ausstattungsmerkmale in SAP prüfen und ggf. ergänzen'],
     ['Bei Bauoption: NT Nr. 2 einen Tag nach Übergabe versenden']]}
 ]},
 abnahme:{t:'Abnahme / Rückgabe',note:'Abnahmetermin so legen, dass es nicht dunkel ist – damit alle Mängel sichtbar sind.',phases:[
   {t:'Vorlauf',items:[
     ['Eingang der Kündigung'],
     ['Kündigungsbestätigung erstellen und versenden (OPCC > Verwaltung-04-Kündigung)'],
     ['Kündigung in SAP pflegen'],
     ['Bei langen Mietverhältnissen: Vorabnahme durchführen (Hinweise z.B. abgenutzter Boden)'],
     ['Abnahmetermin mit dem Mieter terminieren']]},
   {t:'Vorbereitung vor Termin',items:[
     ['Mietvertrag und Übergabeprotokoll ausdrucken'],
     ['Wichtigste Paragrafen des Mietvertrags markieren'],
     ['Genehmigungen in nscale prüfen (z.B. Einbauten Markise, Badewanne)'],
     ['Bauschließungszylinder und Vorhängeschloss organisieren'],
     ['Abnahmeprotokolle vorbereiten und drucken (OPCC > Verwaltung-19-Protokolle)']]},
   {t:'Durchführung – Zustandsprotokoll',items:[
     ['Türgriffe, Jalousien und Schließbarkeit der Fenster prüfen; Mängel unter Bemerkungen'],
     ['Schlüssel abnehmen und im Protokoll festhalten (Seite 02)'],
     ['Stromzähler ablesen (Seite 02), ggf. Warm-/Kaltwasser; Zähler + Stand fotografieren'],
     ['Bei Heizkörpern: Heizkostenverteiler ablesen (Seite 03)'],
     ['Zustand jedes Zimmers festhalten, Balkon prüfen, Pflanzkästen entfernen lassen'],
     ['Zustand der Heizkörper prüfen (streichbedürftig?)'],
     ['Spezialfälle unter Bemerkungen (Deckenlampen, Dübellöcher, Folien, Gardinenstangen)'],
     ['Kellerverschlag abnehmen (Foto + Vorhängeschloss anbringen)'],
     ['Zustandsprotokoll unterschreiben lassen, Verzugsadresse notieren']]},
   {t:'Mieter hat die Wohnung verlassen',items:[
     ['Fotos aller Räume (ab Eingangstür, im Uhrzeigersinn, nachvollziehbar)'],
     ['Schließzylinder gegen gefetteten Bauzylinder tauschen — bei Klemmen: STOP, SFI informieren']]},
   {t:'Nachbereitung',items:[
     ['Bilder im QM-Ordner (WE/Mieteinheit) ablegen + Info Bauschließung/Schlüssel an Vermietung'],
     ['Vattenfall-Leerstandsportal: Zählerstand melden + neue Anschrift mitteilen'],
     ['Zählernummern in SAP pflegen (Mieteinheit > Zählerverwaltung)'],
     ['Schlüssel in SAP pflegen (Mietobjekt > Schlüsselverwaltung)'],
     ['Zählerstände Seite 01–03 an BeKo scannen (Ableseprotokolle-Ordner)'],
     ['Verzugsanschrift in SAP unter Partner pflegen'],
     ['Verzugsanschrift auf Kautionskonto (Hausbank München) pflegen/prüfen']]},
   {t:'Bei Mängeln',items:[
     ['Renovierungsaufforderung erstellen (Übergabe- vs. Abnahmeprotokoll + Fotos vergleichen)'],
     ['Frist 2 Wochen; ggf. Schlüssel + Schlüsselprotokoll an der Rezeption hinterlegen'],
     ['Renovierungsaufforderung per Post versenden; vorab nscale-Scan, Info an Vermietung/Bereichsleitung in cc'],
     ['Wiedervorlage 1 Tag nach Fristablauf notieren'],
     ['Verwalter erstellt Kostenschätzung','Verw'],
     ['Nach Fristablauf ohne Erledigung: Arbeiten ablehnen, Kautionseinzug (OPCC > Mietvertrag > Ablehnung Reno)'],
     ['Mieter über Kautionseinzug informieren (Kautionsabrechnung mit SE und OP)'],
     ['Kondition Schönheitsreparaturen in SAP pflegen (Höhe der Kostenschätzung), Bestätigung einholen']]}
 ]},
 kaution:{t:'Kautionskonto anlegen + Referenznummer',note:'Anlage bei der Hausbank München; anschließend Referenznummer in SAP hinterlegen.',phases:[
   {t:'Anlage bei der Hausbank München',items:[
     ['Bei Hausbank München (HBM) anmelden'],
     ['Startseite HBM → links Reiter „Kautionskonto“ wählen'],
     ['Wirtschaftseinheit + Objekt ausfüllen'],
     ['Links oben „Papier mit Sternchen“ drücken → Kautionskonto anlegen'],
     ['Eingabe-Assistent: mit „Ja“ bestätigen'],
     ['Kontoart + Vergabe Kautionskontonummer unverändert lassen'],
     ['Mietnummer = Mietvertragsnummer; Verfügungshinweis bleibt offen'],
     ['Personendaten pflegen (Anrede, Vor-, Nachname, Geburtsdatum, Adresse)'],
     ['Alle Vertragspartner anlegen'],
     ['Grundkaution gemäß vertraglicher Grundlage'],
     ['Überzahlung – keine Eintragung'],
     ['Fälligkeit = Mietbeginn eintragen'],
     ['Ratenzahlung – nur bei Wohnungen'],
     ['Bankverbindung – keine Eintragung notwendig'],
     ['Daten prüfen → Enter → Kautionsnummer generieren'],
     ['Dokumentendruck → Überweisungsdaten']]},
   {t:'SAP & Ablage',items:[
     ['In SAP unter Referenznummer hinterlegen'],
     ['Sicherheitseinbehaltsabrechnung'],
     ['Ablage Mieterakte']]}
 ]}
};
const ORDER=['mietvertrag','kuendigung','uebergabe','abnahme','kaution'];

let cur='mietvertrag';
let store={};
try{store=JSON.parse(localStorage.getItem('tf_ablaeufe'))||{};}catch(e){store={};}
function save(){try{localStorage.setItem('tf_ablaeufe',JSON.stringify(store));}catch(e){}}
function inst(){if(!store[cur])store[cur]={hdr:{},chk:{}};if(!store[cur].hdr)store[cur].hdr={};if(!store[cur].chk)store[cur].chk={};return store[cur];}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function esc(s){return (s||'').toString().replace(/"/g,'&quot;');}

const selEl=document.getElementById('procSel');
ORDER.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=PROC[k].t;selEl.appendChild(o);});
function switchProc(k){cur=k;render();}

function total(){let n=0;PROC[cur].phases.forEach(p=>n+=p.items.length);return n;}
function toggle(key){const c=inst().chk;c[key]=!c[key];save();render();}
function updHdr(k,v){inst().hdr[k]=v;save();}
function resetProc(){if(confirm('Diesen Prozess zurücksetzen?')){store[cur]={hdr:{},chk:{}};save();render();}}

function render(){
  selEl.value=cur;
  const P=PROC[cur],ins=inst();
  document.getElementById('hdrcard').innerHTML=
    '<div class="g2">'+HDR.map(([k,l])=>`<div><label>${l}</label><input value="${esc(ins.hdr[k])}" ${k==='datum'?'type="date"':''} oninput="updHdr('${k}',this.value)"></div>`).join('')+'</div>';
  const nEl=document.getElementById('note');
  if(P.note){nEl.style.display='block';nEl.textContent='⚠️ '+P.note;}else nEl.style.display='none';
  let done=0;
  document.getElementById('list').innerHTML=P.phases.map((ph,pi)=>{
    const rows=ph.items.map((it,ii)=>{
      const key=cur+'_'+pi+'_'+ii,c=!!ins.chk[key];if(c)done++;
      const role=it[1]?`<span class="role">${it[1]}</span>`:'';
      return `<div class="item ${c?'done':''}" onclick="toggle('${key}')">
        <input type="checkbox" ${c?'checked':''} onclick="event.stopPropagation();toggle('${key}')" aria-label="${esc(it[0])}">
        <div class="txt">${it[0]}${role}</div></div>`;
    }).join('');
    return `<div class="phase"><h2>${ph.t}</h2>${rows}</div>`;
  }).join('');
  const tot=total();
  document.getElementById('doneCount').textContent=done;
  document.getElementById('totalCount').textContent=tot;
  document.getElementById('prog').style.width=(tot?done/tot*100:0)+'%';
  document.getElementById('banner').classList.toggle('show',done===tot&&tot>0);
}

function genPDF(){
  if(!window.jspdf){toast('PDF-Bibliothek lädt noch…');return;}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,M=16,BL=[26,92,143],GR=[107,124,141],BK=[17,17,17];let y=16;const P=PROC[cur],ins=inst();
  doc.setFillColor(...BL);doc.rect(0,0,W,14,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('Testfirma GmbH',M,9);
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text('Prozess-Checkliste',W-M,9,{align:'right'});
  y=26;doc.setTextColor(...BL);doc.setFontSize(15);doc.setFont('helvetica','bold');doc.text(P.t,M,y);y+=8;
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(...BK);
  const hd=HDR.map(([k,l])=>ins.hdr[k]?l+': '+ins.hdr[k]:null).filter(Boolean).join('   ·   ');
  if(hd){doc.setTextColor(...GR);doc.text(doc.splitTextToSize(hd,W-M-M),M,y);y+=7;}
  doc.setDrawColor(...BL);doc.line(M,y,W-M,y);y+=7;
  P.phases.forEach((ph,pi)=>{
    if(y>272){doc.addPage();y=18;}
    doc.setTextColor(...BL);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text(ph.t,M,y);y+=6;
    ph.items.forEach((it,ii)=>{
      if(y>282){doc.addPage();y=18;}
      const c=!!ins.chk[cur+'_'+pi+'_'+ii];
      doc.setDrawColor(120,120,120);doc.rect(M,y-3.4,4,4);
      if(c){doc.setTextColor(26,122,66);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text('X',M+0.7,y);}
      doc.setTextColor(...BK);doc.setFontSize(9.5);doc.setFont('helvetica','normal');
      const label=it[0]+(it[1]?'  ['+it[1]+']':'');
      const wrapped=doc.splitTextToSize(label,W-M-M-8);
      doc.text(wrapped,M+7,y);y+=Math.max(6,wrapped.length*4.8);
    });
    y+=3;
  });
  if(y>276){doc.addPage();y=18;}
  doc.setTextColor(...GR);doc.setFontSize(8);doc.text('Erstellt: '+new Date().toLocaleString('de-DE'),M,y+4);
  doc.save('Checkliste_'+P.t.replace(/[^a-zA-Z0-9]+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.pdf');
  toast('✅ PDF gespeichert');
}
render();
</script>
</body>
</html>
